name: chat-task-consumer

# 2026-08-17 監査 PRIMARY_ROOT_CAUSE の修正3点目。
# チャット発の永続Task(chat-tasks.json)を拾って next_action を実行する Consumer。
# これが無かったため、Task台帳もsession-handoffも「登録されないもの」を
# 復元できず、毎回Ownerが次Promptを手入力する構造になっていた。
# 対話Sessionに依存しない。PCが閉じていても動く。
on:
  schedule:
    # 2026-08-17 実測: このリポジトリの scheduled workflow は cron の指定に
    # 関わらず GitHub 側で間引かれ、実際には1時間に1回しか発火しない。
    #   automation-health-cloud "8,38"  -> 07:09, 08:08   (1回/時)
    #   system-health-cloud     "13,43" -> 07:13, 08:23   (1回/時)
    #   chat-task-consumer      "11,41" -> 09:22          (1回/時)
    # したがって cron を細かくしても起動回数は増えない。
    # 対策は「1回の起動で溜まった分をまとめて処理する」こと（drain）。
    #
    # 訂正: 一時期 "*/30 は :00/:30 が混雑枠だから発火しない" と判断して
    # 分をずらしたが、これは誤りだった。*/30 は 08:33 に実際に発火していた。
    # 未発火を2 tick 分だけ観測して断定したのが誤り。分をずらす意味は
    # 他ワークフローとの競合を少し減らす程度で、Root Cause ではない。
    - cron: "11,41 * * * *"
  workflow_dispatch:
    inputs:
      chain:
        description: "自己連鎖の深さ(自動設定・手動起動は0のままでよい)"
        required: false
        default: "0"

permissions:
  contents: write
  actions: write

concurrency:
  group: chat-task-consumer
  cancel-in-progress: false

jobs:
  consume:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH deploy key (config)
        env:
          CONFIG_DEPLOY_KEY: ${{ secrets.CONFIG_DEPLOY_KEY }}
        run: |
          chmod +x scripts/setup-ssh-keys.sh
          scripts/setup-ssh-keys.sh

      - name: Checkout private config repo
        run: git clone --branch main git@config-gh:yusuken10121990-hub/ai-ops-config.git config

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Quality OS preflight
        working-directory: config
        run: node scripts/quality-os.mjs bootstrap

      - name: Git identity for ledger
        working-directory: config
        run: |
          git config user.name "chat-task-consumer"
          git config user.email "bot@users.noreply.github.com"

      # 1時間に1回しか起動しないため、1回で溜まった分をまとめて処理する。
      - name: Drain task queue
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MAX_TASKS: "4"
        run: |
          chmod +x scripts/drain-chat-tasks.sh
          scripts/drain-chat-tasks.sh "$GITHUB_WORKSPACE/config" "$GITHUB_WORKSPACE" 2400

      # OPENなTaskが残っていれば次のrunを自分で起動する（自己連鎖）。
      # cronはGitHub側で1回/時に間引かれるため、これが無いと残Taskが1時間待たされる。
      # 深さ上限6で無限連鎖を防ぐ（cron発火でchain=0にリセットされる）。
      # drainが1件も前進できず失敗した時は連鎖しない（同じ失敗の無限リトライ防止）。
      - name: Continue drain chain
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN: ${{ github.event.inputs.chain || '0' }}
        run: |
          if [ "$CHAIN" -ge 6 ]; then echo "chain上限(${CHAIN})。次はcronに任せる"; exit 0; fi
          if [ -f /tmp/quota-exhausted ]; then echo "クォータ枯渇のため連鎖しない(cron任せ)"; exit 0; fi
          cd config
          git fetch -q origin main
          git show origin/main:memory/business-os/chat-tasks.json > /tmp/ledger.json
          if node -e "const j=require('/tmp/ledger.json');const now=Date.now();process.exit(j.items.some(t=>t.status==='OPEN'&&t.next_action&&(!t.blockers||!t.blockers.length)&&(!t.lease_until||Date.parse(t.lease_until)<now))?0:1)"; then
            echo "OPEN Taskが残っている。chain=$((CHAIN+1)) で次のrunを起動する"
            gh workflow run chat-task-consumer.yml -R "$GITHUB_REPOSITORY" -f chain=$((CHAIN+1))
          else
            echo "残Taskなし。連鎖終了"
          fi

      # 失敗しても次の手が打てるように、Worker の全ターンを残す。
      - name: Upload worker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-logs-${{ github.run_id }}
          path: |
            config/worker-*.log
            apply-*.log
          if-no-files-found: warn
          retention-days: 14
