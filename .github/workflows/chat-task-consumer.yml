name: chat-task-consumer

# 2026-08-17 監査 PRIMARY_ROOT_CAUSE の修正3点目。
# チャット発の永続Task(chat-tasks.json)を拾って next_action を実行する Consumer。
# これが無かったため、Task台帳もsession-handoffも「登録されないもの」を
# 復元できず、毎回Ownerが次Promptを手入力する構造になっていた。
# 対話Sessionに依存しない。PCが閉じていても動く。
on:
  schedule:
    # 2026-08-17 実測修正: 元は "*/30 * * * *" だったが、workflow 登録から62分
    # 経過しても schedule 起動が0件だった（08:00 の tick が発火しなかった）。
    # GitHub は schedule イベントが高負荷時に遅延・間引かれることを明記しており、
    # 「毎時の開始時刻」が最も混雑する。このリポジトリの実測でも、発火している
    # cron はすべて明示分指定であり :00 に置いた schedule だけが動いていない:
    #   automation-health-cloud "8,38"  → 08:08:50 発火
    #   system-health-cloud     "13,43" → 08:23:09 発火
    #   chat-task-consumer      "*/30"  → 0件
    # よって混雑枠を外し、かつ既存ワークフローと分をずらす。
    - cron: "11,41 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: chat-task-consumer
  cancel-in-progress: false

jobs:
  consume:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH deploy key (config)
        env:
          CONFIG_DEPLOY_KEY: ${{ secrets.CONFIG_DEPLOY_KEY }}
        run: |
          chmod +x scripts/setup-ssh-keys.sh
          scripts/setup-ssh-keys.sh

      - name: Checkout private config repo
        run: git clone --branch main git@config-gh:yusuken10121990-hub/ai-ops-config.git config

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Consume next chat task
        id: pick
        working-directory: config
        run: |
          set +e
          OUT=$(node scripts/chat-task.mjs consume --agent cloud-consumer)
          CODE=$?
          set -e
          if [ "$CODE" = "3" ]; then
            echo "picked=none" >> "$GITHUB_OUTPUT"
            echo "実行対象なし"
            exit 0
          fi
          echo "$OUT"
          TID=$(echo "$OUT" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{console.log(JSON.parse(s).task_id)})")
          NEXT=$(echo "$OUT" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{console.log(JSON.parse(s).next_action)})")
          echo "picked=$TID" >> "$GITHUB_OUTPUT"
          echo "next_action=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Quality OS preflight
        if: steps.pick.outputs.picked != 'none' && steps.pick.outputs.picked != ''
        working-directory: config
        run: node scripts/quality-os.mjs bootstrap

      # 2026-08-17 実測修正: run 32006213949 のジョブログで根本原因が確定した。
      #   `--permission-mode acceptEdits` は「ファイル書き込み」は承認不要で通すが、
      #   Bash コマンド実行には承認プロンプトを出す。ヘッドレス(-p)ではユーザーが
      #   居ないのでプロンプトは自動的に拒否される。台帳更新は Bash 経由
      #   (`node scripts/chat-task.mjs ...`) だったため構造的に実行不能だった。
      #   ログ原文:「ユーザー不在のため、破壊的ではないが承認が必要な
      #   コマンド実行が拒否されました」
      #
      #   → 役割を入れ替える。Worker には **承認不要なファイル書き込み** だけを
      #     させ、Ledger 更新の Bash は Runtime(このワークフロー)側が実行する。
      #     これで「LLMが指示どおりBashを叩けたか」への依存が消える。
      #     --allowedTools は保険として残す。
      - name: Execute next_action (headless)
        id: exec
        if: steps.pick.outputs.picked != 'none' && steps.pick.outputs.picked != ''
        working-directory: config
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          rm -f .chat-task-outcome.json
          set +e
          npx -y @anthropic-ai/claude-code@latest -p "あなたは自律継続Workerです。ユーザーは不在で、質問は一切できません。 Task: ${{ steps.pick.outputs.picked }} / next_action: ${{ steps.pick.outputs.next_action }} 。安全な範囲(読み取り・分析・可逆なファイル変更)のみ実行すること。 blocked にしてよいのは次の7つだけです: 有料契約 / Credential / 法的判断 / 重大な不可逆操作 / 重大な金銭判断 / オーナーにしか決められない経営判断 / AIで安全に解消できないHigh-Risk Conflict。 Context不足・別Repo・別Agent・Test・調査・修正・次Stepは blocker ではありません。自分で解消するか、次のnext_actionに落として advanced にしてください。 実行が終わったら、必ずカレントディレクトリに .chat-task-outcome.json というファイルを書くこと。これがあなたの唯一の報告手段であり、書かなければ作業は無かったことになる。スキーマ: {\"status\":\"advanced\"|\"completed\"|\"blocked\", \"evidence\":\"何を実測したかを具体的に(必須)\", \"next_action\":\"次にやる具体的Action(statusがadvancedなら必須)\", \"resume_point\":\"任意\", \"blocker\":\"statusがblockedなら理由\"} 。Root Goalがまだ達成できていないなら status は advanced にし、next_action に次の一手を必ず入れること。完全に達成できた場合のみ completed にすること。" \
            --permission-mode acceptEdits \
            --allowedTools "Write" "Edit" "Read" "Grep" "Glob" "Bash(node scripts/chat-task.mjs:*)" \
            --max-turns 40
          CODE=$?
          set -e
          echo "claude exit=$CODE"
          echo "claude_exit=$CODE" >> "$GITHUB_OUTPUT"
          echo "--- outcome file ---"
          cat .chat-task-outcome.json 2>/dev/null || echo "(なし)"

      # Worker の報告を Runtime 側で Ledger へ反映する（決定論）。
      # 反映できれば Task は前進 = このrunは成功。
      - name: Apply worker outcome to ledger
        id: apply
        if: always() && steps.pick.outputs.picked != 'none' && steps.pick.outputs.picked != ''
        continue-on-error: true
        run: |
          node scripts/chat-task-apply.mjs \
            --config-dir config \
            --task "${{ steps.pick.outputs.picked }}" \
            --outcome config/.chat-task-outcome.json

      # outcome が無い/壊れている場合だけ後始末する。
      # 前進しなかった場合はここが exit 1 する（= 偽greenを潰す）。
      - name: Reclaim if worker left it in progress
        id: reclaim
        if: always() && steps.apply.outcome == 'failure'
        continue-on-error: true
        working-directory: config
        run: |
          node "$GITHUB_WORKSPACE/scripts/chat-task-reclaim.mjs" \
            memory/business-os/chat-tasks.json \
            "${{ steps.pick.outputs.picked }}" \
            --max-attempts 3 \
            --reason "claude exit=${{ steps.exec.outputs.claude_exit }} / outcome未提出"

      - name: Push ledger
        if: always()
        working-directory: config
        run: |
          git config user.name "chat-task-consumer"
          git config user.email "bot@users.noreply.github.com"
          git add memory/business-os/chat-tasks.json || true
          git diff --cached --quiet || git commit -m "chat-task: consumer cycle"
          git push origin HEAD:main || true

      # 台帳が進んでいないのに green で終わらせない（QUALITY OS: 成功コード=成功ではない）。
      # apply が成功 = Ledger が実際に前進した場合のみ green。
      - name: Fail if task did not advance
        if: always() && steps.pick.outputs.picked != 'none' && steps.pick.outputs.picked != '' && steps.apply.outcome != 'success'
        run: |
          echo "::error::Task ${{ steps.pick.outputs.picked }} を拾ったが台帳が前進しなかった。"
          exit 1
