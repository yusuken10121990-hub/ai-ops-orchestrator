name: ops-auto-repair-cloud

# 2026-10-13 owner directive: "all systems are checked automatically and fixed
# without being asked; must not depend on the PC being on".
# Runs config/scripts/ops-auto-repair-detector.mjs in the cloud: monitoring NG
# (health / backup / automation / local-watch ledgers) and Railway projects missing
# from systems.json are turned into repair tasks in memory/code-task-queue.json.
# Pure script, no Claude call. npm audit of PC-only repos stays on the local task
# AIOps-OpsAutoRepair-Headless (repos not reachable from here are skipped).
on:
  schedule:
    - cron: "50 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: ops-auto-repair-cloud
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout orchestrator (scripts only)
        uses: actions/checkout@v7

      - name: Setup SSH deploy key (config)
        env:
          CONFIG_DEPLOY_KEY: ${{ secrets.CONFIG_DEPLOY_KEY }}
        run: |
          chmod +x scripts/setup-ssh-keys.sh
          scripts/setup-ssh-keys.sh

      - name: Checkout private config repo via deploy key (SSH)
        run: git clone --branch main git@config-gh:yusuken10121990-hub/ai-ops-config.git config

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Run ops-auto-repair-detector
        env:
          MEM_DIR: config/memory
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_REPO: ${{ github.repository }}
        run: |
          code=$(curl -s -o /tmp/g.json -w '%{http_code}' https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_API_TOKEN" -H 'Content-Type: application/json' \
            -d '{"query":"{ projects { edges { node { id } } } }"}')
          echo "railway graphql http=$code projects=$(grep -o '"id"' /tmp/g.json | wc -l) err=$(grep -o '"message":"[^"]*"' /tmp/g.json | head -1)"
          node config/scripts/ops-auto-repair-detector.mjs

      # 2026-10-19: a rejected Railway token used to look like "0 projects, all registered".
      # The detector now records state.railwayError; surface it as an annotation + one open issue
      # (no comment spam on the hourly cron; auto-closed once enumeration works again).
      - name: Alert on Railway enumeration failure
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          err=$(node -e "const s=require('./config/memory/ops-auto-repair-state.json');process.stdout.write(s.railwayError?'1':'')" 2>/dev/null || true)
          title="ops-auto-repair: Railwayプロジェクト一覧を取得できません"
          existing=$(gh issue list -R "${GITHUB_REPOSITORY}" --state open --search "in:title \"${title}\"" --json number --jq '.[0].number // empty')
          if [ -n "${err}" ]; then
            echo "::error::Railway project enumeration failed (details: config/memory/ops-auto-repair-state.json railwayError)"
            if [ -z "${existing}" ]; then
              gh issue create -R "${GITHUB_REPOSITORY}" --title "${title}" --label "p1-alert" \
                --body "自動検知(ops-auto-repair-cloud): Railway API/CLIでプロジェクト一覧が取れず、台帳照合が止まっています。詳細は非公開台帳 config/memory/ops-auto-repair-state.json の railwayError。復旧を検知すると自動でcloseします。"
            fi
          elif [ -n "${existing}" ]; then
            gh issue comment -R "${GITHUB_REPOSITORY}" "${existing}" --body "Railwayプロジェクト一覧の取得が復旧しました。自動closeします。"
            gh issue close -R "${GITHUB_REPOSITORY}" "${existing}"
          fi

      - name: Commit & push queue/state to config repo
        working-directory: config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memory/ops-auto-repair-state.json memory/code-task-queue.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: ops-auto-repair-cloud ($(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST'))"
            bash ../scripts/git-push-retry.sh git@config-gh:yusuken10121990-hub/ai-ops-config.git main
          fi
