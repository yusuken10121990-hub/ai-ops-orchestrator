name: zerosys-ad-pdca

# ZEROSYS広告AIパイプラインの自律エンジン(状態機械)をクラウドで無人実行する。
# 2026-08-18オーナー指示「このセッションをバック側でやれよ」により、ローカルの
# scheduled-task 実行から移設した。SKILL本体は config/.claude/scheduled-tasks/zerosys-ad-pdca/。
# JST 09:40 = UTC 0:40（team-learning-loop=UTC1:00 / ad-pdca-daily=UTC1:10 と衝突しない分に置く）
on:
  schedule:
    - cron: "40 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: zerosys-ad-pdca
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout orchestrator (public, scripts only)
        uses: actions/checkout@v7

      - name: Setup SSH deploy keys (config + ai-business-ops + sales-research-tool + meta-ads, one host-alias per repo)
        env:
          CONFIG_DEPLOY_KEY: ${{ secrets.CONFIG_DEPLOY_KEY }}
          AI_BUSINESS_OPS_DEPLOY_KEY: ${{ secrets.AI_BUSINESS_OPS_DEPLOY_KEY }}
          SALES_RESEARCH_DEPLOY_KEY: ${{ secrets.SALES_RESEARCH_DEPLOY_KEY }}
          META_ADS_DEPLOY_KEY: ${{ secrets.META_ADS_DEPLOY_KEY }}
        run: |
          chmod +x scripts/setup-ssh-keys.sh
          scripts/setup-ssh-keys.sh

      - name: Checkout private config repo via deploy key (SSH)
        run: |
          git clone --depth 1 --branch main git@config-gh:yusuken10121990-hub/ai-ops-config.git config

      - name: Checkout ai-business (ai-business-ops + sales-research-tool + meta-ads)
        run: |
          chmod +x scripts/checkout-ai-business.sh
          scripts/checkout-ai-business.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: "Install deps (meta-ads: pull-data.js/fetch-placements.js/apply-*.js need facebook-nodejs-business-sdk)"
        run: |
          if [ -f "${AI_BUSINESS_DIR}/meta-ads/package.json" ]; then
            (cd "${AI_BUSINESS_DIR}/meta-ads" && (npm ci --no-audit --no-fund || npm install --no-audit --no-fund))
          fi

      # 2026-07-19: cv-forensics (新設・広告CV鑑識官) がSKILL.md (2)分析4者委任と
      # (3.6)3日毎フル監査(Google Ads CID 7357396296含む全数調査)の対象に追加された。
      # Google Ads側の認証情報(secrets)はこのワークフローにはまだ無いため、依存だけ
      # 入れておきスクリプト自体はGoogle Ads分を認証情報未設定として自己スキップする
      # (SKILL.md (3.6)節参照)。ad-lp-apply-daily.yml と同じ導入パターンを踏襲。
      - name: "Install deps (google-ads: cv-forensicsの3日毎フル監査がGoogle Ads分も参照するため)"
        run: |
          if [ -f "${AI_BUSINESS_DIR}/google-ads/package.json" ]; then
            (cd "${AI_BUSINESS_DIR}/google-ads" && (npm ci --no-audit --no-fund || npm install --no-audit --no-fund))
          fi

      - name: Run zerosys-ad-pdca
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GATE_URL: ${{ secrets.GATE_URL }}
          GATE_AGENT_KEY: ${{ secrets.GATE_AGENT_KEY }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          # Meta Ads API credentials (ai-business/meta-ads/.env locally). Set via:
          #   gh secret set META_APP_ID -R yusuken10121990-hub/ai-ops-orchestrator
          #   gh secret set META_APP_SECRET -R yusuken10121990-hub/ai-ops-orchestrator
          #   gh secret set META_SYSTEM_USER_TOKEN -R yusuken10121990-hub/ai-ops-orchestrator
          #   gh secret set META_AD_ACCOUNT_ID -R yusuken10121990-hub/ai-ops-orchestrator
          #   gh secret set META_API_VERSION -R yusuken10121990-hub/ai-ops-orchestrator   (optional, defaults to v21.0)
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          META_API_VERSION: ${{ secrets.META_API_VERSION }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_ACCOUNT_ID: ${{ secrets.META_IG_ACCOUNT_ID }}
          META_PIXEL_ID: ${{ secrets.META_PIXEL_ID }}
          # Google Ads API credentials (ai-business/google-ads/.env locally). 2026-07-19
          # owner-todos.md google-ads-secrets-and-workflow-fix: this workflow never wired
          # GOOGLE_ADS_* through, so ad-pdca-daily's Google Ads collection silently no-op'd.
          # Set via:
          #   gh secret set GOOGLE_ADS_DEVELOPER_TOKEN -R yusuken10121990-hub/ai-ops-orchestrator
          #   gh secret set GOOGLE_ADS_CLIENT_ID -R yusuken10121990-hub/ai-ops-orchestrator
          #   gh secret set GOOGLE_ADS_CLIENT_SECRET -R yusuken10121990-hub/ai-ops-orchestrator
          #   gh secret set GOOGLE_ADS_REFRESH_TOKEN -R yusuken10121990-hub/ai-ops-orchestrator
          #   gh secret set GOOGLE_ADS_LOGIN_CUSTOMER_ID -R yusuken10121990-hub/ai-ops-orchestrator
          #   gh secret set GOOGLE_ADS_CUSTOMER_ID -R yusuken10121990-hub/ai-ops-orchestrator
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          # GA4 Data API (LP側ファネル fn_* イベント)。write-ad-funnel-ledger.mjs が
          # GA4_PROPERTY_ID / GA4_REFRESH_TOKEN を読み、トークン更新には
          # GOOGLE_ADS_CLIENT_ID / GOOGLE_ADS_CLIENT_SECRET を再利用する。
          # 未設定なら「未接続」として報告される（0件として扱われることはない）。
          #   gh secret set GA4_PROPERTY_ID -R yusuken10121990-hub/ai-ops-orchestrator
          #   gh secret set GA4_REFRESH_TOKEN -R yusuken10121990-hub/ai-ops-orchestrator
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_REFRESH_TOKEN: ${{ secrets.GA4_REFRESH_TOKEN }}
        run: |
          chmod +x scripts/run-loop.sh
          # meta-ads scripts load .env via `import 'dotenv/config'`; since CI has no
          # .env file (gitignored, never pushed), write one from the secrets above so
          # pull-data.js/apply-*.js work unmodified. Values are secrets — this file
          # lives only on the ephemeral runner and is never committed (gitignored).
          if [ -n "${META_SYSTEM_USER_TOKEN:-}" ]; then
            ENV_FILE="${AI_BUSINESS_DIR}/meta-ads/.env"
            : > "${ENV_FILE}"
            printf 'META_APP_ID=%s\n' "${META_APP_ID}" >> "${ENV_FILE}"
            printf 'META_APP_SECRET=%s\n' "${META_APP_SECRET}" >> "${ENV_FILE}"
            printf 'META_SYSTEM_USER_TOKEN=%s\n' "${META_SYSTEM_USER_TOKEN}" >> "${ENV_FILE}"
            printf 'META_AD_ACCOUNT_ID=%s\n' "${META_AD_ACCOUNT_ID}" >> "${ENV_FILE}"
            printf 'META_API_VERSION=%s\n' "${META_API_VERSION:-v21.0}" >> "${ENV_FILE}"
            printf 'META_PAGE_ID=%s\n' "${META_PAGE_ID}" >> "${ENV_FILE}"
            printf 'META_IG_ACCOUNT_ID=%s\n' "${META_IG_ACCOUNT_ID}" >> "${ENV_FILE}"
            printf 'META_PIXEL_ID=%s\n' "${META_PIXEL_ID}" >> "${ENV_FILE}"
          else
            echo "WARN: META_SYSTEM_USER_TOKEN secret not set -- meta-ads data collection step will fail. Loop will still run and record 'continue observing' / gate items where possible."
          fi
          if [ -n "${GOOGLE_ADS_DEVELOPER_TOKEN:-}" ]; then
            GENV_FILE="${AI_BUSINESS_DIR}/google-ads/.env"
            : > "${GENV_FILE}"
            printf 'GOOGLE_ADS_DEVELOPER_TOKEN=%s\n' "${GOOGLE_ADS_DEVELOPER_TOKEN}" >> "${GENV_FILE}"
            printf 'GOOGLE_ADS_CLIENT_ID=%s\n' "${GOOGLE_ADS_CLIENT_ID}" >> "${GENV_FILE}"
            printf 'GOOGLE_ADS_CLIENT_SECRET=%s\n' "${GOOGLE_ADS_CLIENT_SECRET}" >> "${GENV_FILE}"
            printf 'GOOGLE_ADS_REFRESH_TOKEN=%s\n' "${GOOGLE_ADS_REFRESH_TOKEN}" >> "${GENV_FILE}"
            printf 'GOOGLE_ADS_LOGIN_CUSTOMER_ID=%s\n' "${GOOGLE_ADS_LOGIN_CUSTOMER_ID}" >> "${GENV_FILE}"
            printf 'GOOGLE_ADS_CUSTOMER_ID=%s\n' "${GOOGLE_ADS_CUSTOMER_ID}" >> "${GENV_FILE}"
            if [ -n "${GA4_REFRESH_TOKEN:-}" ]; then
              printf 'GA4_PROPERTY_ID=%s\n' "${GA4_PROPERTY_ID}" >> "${GENV_FILE}"
              printf 'GA4_REFRESH_TOKEN=%s\n' "${GA4_REFRESH_TOKEN}" >> "${GENV_FILE}"
            else
              echo "WARN: GA4_REFRESH_TOKEN secret not set -- LP funnel (fn_* events) is reported as unavailable, never as zero."
            fi
          else
            echo "WARN: GOOGLE_ADS_DEVELOPER_TOKEN secret not set -- google-ads data collection step will fail. Loop will still run and record 'continue observing' / gate items where possible."
          fi
          bash scripts/run-loop.sh zerosys-ad-pdca

      # P1(2026-07-25、オーナー依頼): LLM(cmo/ad-lp-analyst)分析任せの上のステップとは別に、
      # 「広告費が実成果(Stripe実決済/Google Ads CV)にまったく結びついていない」「計測
      # (Pixel/CAPI/Google Ads CV)が死んでいる」を毎回必ず機械的にチェックする決定論スクリプト
      # (automation-health-check.mjsと同じ設計思想、LLM不使用)。読み取りのみ・金銭操作は一切
      # 行わない。P1検知時のみGitHub Issueを起票(LINE/Slackには送らない、通知ルール準拠)。
      - name: Run ad-money-guard (decision-only, no LLM, spend-vs-actual-result guard)
        env:
          OPS_DASHBOARD_KEY: ${{ secrets.OPS_DASHBOARD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG_DIR: config
        run: |
          node scripts/ad-money-guard.mjs

      # フェーズ1安全装置(2026-07-25 dev-devops、詳細はad-lp-apply-daily.ymlの同名ステップの
      # コメント参照)。ad-pdca-dailyとad-lp-apply-dailyは別スケジュールで走るため、両方の
      # ワークフローで実行しstatusを最新化する(ad-money-guardと同じ考え方、CONFIG_DIR配下の
      # 状態ファイルはconfig/memory/ad-circuit-breaker-state.jsonの月次アキュムレータで
      # 二重カウントを防止済み)。
      # 2026-08-18: ここにあった ad-circuit-breaker ステップを削除した。参照先の
      # scripts/ad-circuit-breaker.mjs は origin/master に存在せず MODULE_NOT_FOUND で
      # 落ち、後続の commit & push まで skip させていた(run 32084977599)。原因は、この
      # ワークフローの土台にした ad-pdca-daily.yml を「ローカル作業ツリー」から複製した
      # こと(ローカルには未pushでremoteに無いステップが混ざっていた)。恒久対策: クラウド
      # のワークフローを複製するときは必ず origin/master の内容を土台にする。
      - name: Commit & push generated learnings to private config repo (SSH)
        working-directory: config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: zerosys-ad-pdca auto update ($(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST'))"
            bash ../scripts/git-push-retry.sh git@config-gh:yusuken10121990-hub/ai-ops-config.git main
          fi

      - name: Sync ai-business changes back (ai-business-ops / sales-research-tool / meta-ads)
        run: |
          chmod +x scripts/sync-ai-business.sh
          scripts/sync-ai-business.sh
# Note (2026-07-17): no LINE-on-failure step here by design. Owner rule
# (~/.claude/CLAUDE.md "LINE通知ルール"): LINE is reserved for money-approval
# requests only. Failure visibility lives in the Actions run history /
# dashboard "稼働状況" tab instead.
